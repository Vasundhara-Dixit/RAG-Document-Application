<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 510 612" width="510" height="612" role="img" aria-labelledby="t d"><title id="t">Introduction — Vasundhara Dixit</title><desc id="d">Hello, I’m Vasundhara Dixit, a data analyst, Python developer and agentic-AI developer. I build AI-powered solutions where intelligence meets creativity: turning data into decisions, teaching machines to see through computer vision, and shaping technology that can make healthcare better. My everyday toolkit is Python, PyTorch and TensorFlow, with AWS for the cloud and Flask for APIs. Beyond the code, I’m a creative technologist who designs with Canva and treats every project as a chance to build something meaningful.</desc><style>.sa{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.se{font-family:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}.k{fill:#6c4dc4;font-weight:600}.kp{fill:#c93d78;font-weight:600}</style><defs><linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8ff"/><stop offset="1" stop-color="#fff1f8"/></linearGradient><linearGradient id="iline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c4dc4"/><stop offset=".6" stop-color="#c93d78"/><stop offset="1" stop-color="#94701a"/></linearGradient><linearGradient id="iname" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a2f9a"/><stop offset="1" stop-color="#c93d78"/></linearGradient></defs><rect x="1" y="14" width="508" height="584" rx="22" fill="url(#ibg)" stroke="#8f74d8" stroke-opacity=".38"/><rect x="24" y="14" width="460" height="2" rx="1" fill="url(#iline)"/><text x="26" y="72" class="se" font-size="23" font-style="italic" fill="#4b3d70">Hello, I’m</text><text x="24" y="120" class="se" font-size="45" font-weight="700" fill="url(#iname)" letter-spacing="-.5">Vasundhara Dixit</text><text x="26" y="154" class="sa" font-size="17.5" font-weight="500" fill="#2a1f45">a data analyst, Python developer and agentic-AI</text><text x="26" y="179" class="sa" font-size="17.5" font-weight="500" fill="#2a1f45">developer.</text><rect x="26" y="201" width="56" height="3" rx="1.5" fill="url(#iline)"/><text x="26" y="235" class="sa" font-size="15" fill="#4b3d70">I build AI-powered solutions where intelligence meets</text><text x="26" y="259" class="sa" font-size="15" fill="#4b3d70">creativity: turning data into decisions, teaching</text><text x="26" y="283" class="sa" font-size="15" fill="#4b3d70">machines to see through <tspan class="kp">computer</tspan> <tspan class="kp">vision,</tspan> and shaping</text><text x="26" y="307" class="sa" font-size="15" fill="#4b3d70">technology that can make <tspan class="kp">healthcare</tspan> better.</text><text x="26" y="337" class="sa" font-size="15" fill="#4b3d70">My everyday toolkit is <tspan class="k">Python,</tspan> <tspan class="k">PyTorch</tspan> and</text><text x="26" y="361" class="sa" font-size="15" fill="#4b3d70"><tspan class="k">TensorFlow,</tspan> with <tspan class="k">AWS</tspan> for the cloud and <tspan class="k">Flask</tspan> for</text><text x="26" y="385" class="sa" font-size="15" fill="#4b3d70">APIs. Beyond the code, I’m a creative technologist who</text><text x="26" y="409" class="sa" font-size="15" fill="#4b3d70">designs with Canva and treats every project as a</text><text x="26" y="433" class="sa" font-size="15" fill="#4b3d70">chance to build something meaningful.</text><rect x="26" y="461" width="456" height="106" rx="14" fill="#ffffff" fill-opacity=".72" stroke="#8f74d8" stroke-opacity="0.25"/><rect x="26" y="461" width="4" height="106" rx="2" fill="url(#iline)"/><text x="48" y="489" class="se" font-size="18.5" font-style="italic" fill="#2a1f45">Build with intelligence, create with</text><text x="48" y="517" class="se" font-size="18.5" font-style="italic" fill="#2a1f45">purpose, and let technology become an</text><text x="48" y="545" class="se" font-size="18.5" font-style="italic" fill="#2a1f45">extension of your creativity.</text></svg>