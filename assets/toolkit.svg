<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 304" width="830" height="304" role="img" aria-label="Tech stack"><title>Tech stack</title><desc>Languages: Python, HTML5, CSS, C++. AI/ML: PyTorch, TensorFlow. Cloud: AWS. Tools: GitHub, Kaggle. Design: Canva. Web/API: Flask API.</desc><style>
:root{--bg0:#fbf8ff;--bg1:#fff1f8;--ink:#2a1f45;--muted:#5d4f80;--faint:#8a7ca8;--line:#8f74d8;
--lav:#6c4dc4;--pink:#d2467f;--emerald:#178a63;--gold:#9a741d;--sky:#3f73c4;--tile:#ffffff;--tileop:.66;--track:#e6def7}
@media (prefers-color-scheme:dark){:root{--bg0:#160f24;--bg1:#221636;--ink:#f6f0ff;--muted:#bcaedb;--faint:#8f80b3;
--line:#cbb8ff;--lav:#cbb8ff;--pink:#ffb8d6;--emerald:#6fe0b0;--gold:#e9cf8f;--sky:#9dbcf2;--tile:#ffffff;--tileop:.06;--track:#33254d}}
.serif{font-family:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif} .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.ink{fill:var(--ink)} .muted{fill:var(--muted)} .faint{fill:var(--faint)}
.lav{fill:var(--lav)} .pink{fill:var(--pink)} .emerald{fill:var(--emerald)} .gold{fill:var(--gold)}
.g0{stop-color:var(--bg0)} .g1{stop-color:var(--bg1)}
.sl{stop-color:var(--lav)} .sp{stop-color:var(--pink)} .se{stop-color:var(--emerald)} .sg{stop-color:var(--gold)}
.card{stroke:var(--line);stroke-opacity:.32;stroke-width:1}
.tile{fill:var(--tile);fill-opacity:var(--tileop);stroke:var(--line);stroke-opacity:.26;stroke-width:1}
.track{fill:var(--track)}
.sky{fill:var(--sky)}</style><defs></defs><rect x="0" y="0" width="407" height="92" rx="20" class="tile"/><text x="24" y="34" class="serif muted" font-size="17" font-style="italic">Languages</text><g><rect x="24.0" y="46" width="86.3" height="30" rx="15.0" class="tile"/><circle cx="40.0" cy="61.0" r="3.6" class="lav"/><text x="53.0" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="46.3" lengthAdjust="spacing">Python</text></g><g><rect x="120.3" y="46" width="87.0" height="30" rx="15.0" class="tile"/><circle cx="136.3" cy="61.0" r="3.6" class="pink"/><text x="149.3" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="47.0" lengthAdjust="spacing">HTML5</text></g><g><rect x="217.3" y="46" width="67.5" height="30" rx="15.0" class="tile"/><circle cx="233.3" cy="61.0" r="3.6" class="emerald"/><text x="246.3" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="27.5" lengthAdjust="spacing">CSS</text></g><g><rect x="294.8" y="46" width="70.2" height="30" rx="15.0" class="tile"/><circle cx="310.8" cy="61.0" r="3.6" class="gold"/><text x="323.8" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="30.2" lengthAdjust="spacing">C++</text></g><rect x="423" y="0" width="407" height="92" rx="20" class="tile"/><text x="447" y="34" class="serif muted" font-size="17" font-style="italic">AI / ML</text><g><rect x="447.0" y="46" width="95.5" height="30" rx="15.0" class="tile"/><circle cx="463.0" cy="61.0" r="3.6" class="sky"/><text x="476.0" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="55.5" lengthAdjust="spacing">PyTorch</text></g><g><rect x="552.5" y="46" width="118.6" height="30" rx="15.0" class="tile"/><circle cx="568.5" cy="61.0" r="3.6" class="lav"/><text x="581.5" y="65.8" class="sans ink" font-size="13.5" font-weight="500" textLength="78.6" lengthAdjust="spacing">TensorFlow</text></g><rect x="0" y="106" width="407" height="92" rx="20" class="tile"/><text x="24" y="140" class="serif muted" font-size="17" font-style="italic">Cloud</text><g><rect x="24.0" y="152" width="70.0" height="30" rx="15.0" class="tile"/><circle cx="40.0" cy="167.0" r="3.6" class="pink"/><text x="53.0" y="171.8" class="sans ink" font-size="13.5" font-weight="500" textLength="30.0" lengthAdjust="spacing">AWS</text></g><rect x="423" y="106" width="407" height="92" rx="20" class="tile"/><text x="447" y="140" class="serif muted" font-size="17" font-style="italic">Tools</text><g><rect x="447.0" y="152" width="84.7" height="30" rx="15.0" class="tile"/><circle cx="463.0" cy="167.0" r="3.6" class="emerald"/><text x="476.0" y="171.8" class="sans ink" font-size="13.5" font-weight="500" textLength="44.7" lengthAdjust="spacing">GitHub</text></g><g><rect x="541.7" y="152" width="82.9" height="30" rx="15.0" class="tile"/><circle cx="557.7" cy="167.0" r="3.6" class="gold"/><text x="570.7" y="171.8" class="sans ink" font-size="13.5" font-weight="500" textLength="42.9" lengthAdjust="spacing">Kaggle</text></g><rect x="0" y="212" width="407" height="92" rx="20" class="tile"/><text x="24" y="246" class="serif muted" font-size="17" font-style="italic">Design</text><g><rect x="24.0" y="258" width="78.9" height="30" rx="15.0" class="tile"/><circle cx="40.0" cy="273.0" r="3.6" class="sky"/><text x="53.0" y="277.8" class="sans ink" font-size="13.5" font-weight="500" textLength="38.9" lengthAdjust="spacing">Canva</text></g><rect x="423" y="212" width="407" height="92" rx="20" class="tile"/><text x="447" y="246" class="serif muted" font-size="17" font-style="italic">Web / API</text><g><rect x="447.0" y="258" width="102.0" height="30" rx="15.0" class="tile"/><circle cx="463.0" cy="273.0" r="3.6" class="lav"/><text x="476.0" y="277.8" class="sans ink" font-size="13.5" font-weight="500" textLength="62.0" lengthAdjust="spacing">Flask API</text></g></svg>