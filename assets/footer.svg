<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 200" width="830" height="200" role="img" aria-label="Footer quote"><title>Footer quote</title><desc>Build with intelligence, create with purpose, and let technology become an extension of your creativity.</desc><style>
:root{--bg0:#fbf8ff;--bg1:#fff1f8;--ink:#2a1f45;--muted:#5d4f80;--faint:#8a7ca8;--line:#8f74d8;
--lav:#6c4dc4;--pink:#d2467f;--emerald:#178a63;--gold:#9a741d;--sky:#3f73c4;--tile:#ffffff;--tileop:.66;--track:#e6def7}
@media (prefers-color-scheme:dark){:root{--bg0:#160f24;--bg1:#221636;--ink:#f6f0ff;--muted:#bcaedb;--faint:#8f80b3;
--line:#cbb8ff;--lav:#cbb8ff;--pink:#ffb8d6;--emerald:#6fe0b0;--gold:#e9cf8f;--sky:#9dbcf2;--tile:#ffffff;--tileop:.06;--track:#33254d}}
.serif{font-family:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif} .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.ink{fill:var(--ink)} .muted{fill:var(--muted)} .faint{fill:var(--faint)}
.lav{fill:var(--lav)} .pink{fill:var(--pink)} .emerald{fill:var(--emerald)} .gold{fill:var(--gold)}
.g0{stop-color:var(--bg0)} .g1{stop-color:var(--bg1)}
.sl{stop-color:var(--lav)} .sp{stop-color:var(--pink)} .se{stop-color:var(--emerald)} .sg{stop-color:var(--gold)}
.card{stroke:var(--line);stroke-opacity:.32;stroke-width:1}
.tile{fill:var(--tile);fill-opacity:var(--tileop);stroke:var(--line);stroke-opacity:.26;stroke-width:1}
.track{fill:var(--track)}
.sky{fill:var(--sky)}</style><defs></defs><rect x="411" y="10" width="8" height="8" rx="1.5" transform="rotate(45 415 14)" class="gold"/><text x="415" y="58" text-anchor="middle" class="serif ink" font-size="21" font-style="italic">Build with intelligence, create with purpose,</text><text x="415" y="88" text-anchor="middle" class="serif ink" font-size="21" font-style="italic">and let technology become an extension of your creativity.</text><text x="415" y="128" text-anchor="middle" class="sans muted" font-size="12.5">© 2026 Vasundhara Dixit</text><path d="M0 156 C138 141 277 171 415 156 S692 141 830 156 V200 H0 Z" class="lav" fill-opacity="0.34"><animate attributeName="d" values="M0 156 C138 141 277 171 415 156 S692 141 830 156 V200 H0 Z;M0 156 C138 171 277 141 415 156 S692 171 830 156 V200 H0 Z;M0 156 C138 141 277 171 415 156 S692 141 830 156 V200 H0 Z" dur="13s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path><path d="M0 168 C138 181 277 155 415 168 S692 181 830 168 V200 H0 Z" class="pink" fill-opacity="0.3"><animate attributeName="d" values="M0 168 C138 181 277 155 415 168 S692 181 830 168 V200 H0 Z;M0 168 C138 155 277 181 415 168 S692 155 830 168 V200 H0 Z;M0 168 C138 181 277 155 415 168 S692 181 830 168 V200 H0 Z" dur="17s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path><path d="M0 181 C138 170 277 192 415 181 S692 170 830 181 V200 H0 Z" class="gold" fill-opacity="0.28"><animate attributeName="d" values="M0 181 C138 170 277 192 415 181 S692 170 830 181 V200 H0 Z;M0 181 C138 192 277 170 415 181 S692 192 830 181 V200 H0 Z;M0 181 C138 170 277 192 415 181 S692 170 830 181 V200 H0 Z" dur="21s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path></svg>